<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Image Prediction</title>
</head>
<body>
    <h1>Upload Image for YOLO Prediction</h1>
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="uploadImage()">Upload and Predict</button>
    
    <h3>Prediction Results:</h3>
    <img id="resultImage" style="width: 500px;">
    
    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const response = await fetch('http://localhost:8000/predict', {  // Replace with your backend URL
                method: 'POST',
                body: formData,
            });

            if (response.ok) {
                const result = await response.json();
                console.log(result.predicted_image_url);

                // Display the predicted image with bounding boxes
                const resultImage = document.getElementById('resultImage');
                resultImage.src = result.predicted_image_url; // Set image source to predicted image URL
            } else {
                alert("Error in prediction.");
            }
        }
    </script>
</body>
</html>
